<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102018" />
    <meta
      name="description"
      content="Boundry cafe drills: flashcards and multiple choice for Jason’s SOC Tier-1 talk track."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Boundry Cafe Drills</title>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-kicker">Boundry · Cafe mode</div>
          <h1>Talk-track drills</h1>
          <p>Flashcards + multiple choice. Honest junior framing.</p>
        </div>
      </header>

      <p id="installHint" class="install-hint">
        On iPhone: Share → Add to Home Screen. On Android: browser menu → Install app.
      </p>

      <div class="modes" role="tablist" aria-label="Quiz mode">
        <button class="mode-btn active" data-mode="home" type="button">
          <strong>Home</strong>
          <span>Pick a drill</span>
        </button>
        <button class="mode-btn" data-mode="flash" type="button">
          <strong>Flashcards</strong>
          <span>Term → say this</span>
        </button>
        <button class="mode-btn" data-mode="mc" type="button">
          <strong>Multiple choice</strong>
          <span>Check yourself</span>
        </button>
        <button class="mode-btn" data-mode="mix" type="button">
          <strong>Mixed deck</strong>
          <span>Both, shuffled</span>
        </button>
      </div>

      <div id="toolbar" class="toolbar" hidden></div>
      <div id="stats" class="stats" hidden></div>
      <section id="stage" class="card home-card" aria-live="polite"></section>
    </main>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
