<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>PenTrace</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand glitch-title small" data-text="PenTrace">PenTrace</div>
        <div id="topinfo" class="topinfo"></div>
        <div class="spacer"></div>
        <div id="credits" class="credits"><span id="credits-val">0</span><span class="cur">¢</span></div>
        <nav class="topnav">
          <button id="btn-mail">MAIL<span id="mail-badge" class="badge-n"></span></button>
          <button id="btn-jobs">JOBS</button>
          <button id="btn-contacts">CONTACTS</button>
          <button id="btn-perks">PERKS</button>
          <button id="btn-shop">SHOP</button>
          <button id="btn-index">INDEX <span id="index-count" class="dim"></span><span id="index-badge" class="badge-n"></span></button>
          <button id="btn-train" title="Start or resume the training sim">TRAIN</button>
          <button id="guide-btn" title="Toggle the NEXT STEP guide">GUIDE</button>
          <button id="sound-btn" title="Toggle sound">SFX</button>
        </nav>
      </header>
      <main class="grid">
        <aside class="col left">
          <section id="trace" class="panel"></section>
          <section id="ram" class="panel"></section>
          <section id="guide" class="panel guide"></section>
        </aside>
        <section class="panel term-panel">
          <div class="term-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">neosh // ghost-rig</span></div>
          <div id="terminal"></div>
        </section>
        <aside class="col right">
          <section id="target" class="panel target"></section>
          <section id="netmap" class="panel netmap"></section>
        </aside>
      </main>
      <div id="toasts"></div>
      <div id="banner"></div>
      <div id="modal" hidden><div id="modal-box" class="modal-box"></div></div>
      <div id="traced" hidden></div>
      <div id="title"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
