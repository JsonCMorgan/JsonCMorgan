# Path-based PR labels, applied by .github/workflows/labeler.yml.
'area:engine':
  - changed-files:
      - any-glob-to-any-file: 'neontrace/src/engine/**'
'area:ui':
  - changed-files:
      - any-glob-to-any-file: ['neontrace/src/ui/**', 'neontrace/src/*.css', 'neontrace/index.html']
'area:desktop':
  - changed-files:
      - any-glob-to-any-file: 'neontrace/src-tauri/**'
'area:ci':
  - changed-files:
      - any-glob-to-any-file: '.github/**'
'area:build':
  - changed-files:
      - any-glob-to-any-file:
          - 'neontrace/package.json'
          - 'neontrace/package-lock.json'
          - 'neontrace/*.config.*'
          - 'neontrace/tsconfig.json'
'area:docs':
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'neontrace/docs/**']
'area:tests':
  - changed-files:
      - any-glob-to-any-file: 'neontrace/tests/**'
'type:content':
  - changed-files:
      - any-glob-to-any-file: 'neontrace/src/engine/content/**'
