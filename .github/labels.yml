# Synced to the repo by .github/workflows/labels.yml. Edit here, not in the UI.
# GitHub's default labels are kept (skip-delete in the sync workflow).

# Type
- name: type:bug
  color: d73a4a
  description: Something is broken
- name: type:feature
  color: a2eeef
  description: New gameplay or tooling feature
- name: type:content
  color: ff00c8
  description: New contract, host, Index entry or story content
- name: type:chore
  color: cfd3d7
  description: Maintenance, refactors, tooling

# Area
- name: area:engine
  color: 1d76db
  description: Simulation core (pentrace/src/engine)
- name: area:ui
  color: 5319e7
  description: Terminal, panels, effects (pentrace/src/ui)
- name: area:desktop
  color: 0e8a16
  description: Tauri shell and installers (pentrace/src-tauri)
- name: area:ci
  color: 000000
  description: GitHub Actions and repo automation
- name: area:build
  color: bfdadc
  description: npm, Vite, TypeScript, lint config
- name: area:docs
  color: 0075ca
  description: README, CONTRIBUTING, Index text
- name: area:tests
  color: c2e0c6
  description: Unit tests and coverage

# Roadmap
- name: epic
  color: 3e4b9e
  description: Milestone-level feature that spans several PRs
- name: workshop
  color: 00f0ff
  description: Player-built tools (plan section 12A)
- name: scripting
  color: fbca04
  description: Bash or Python scripting in game
- name: blue-team
  color: 0052cc
  description: Defensive / SOC gameplay
- name: learning
  color: 7057ff
  description: Teaches a real security concept (Index, curriculum)

# Priority
- name: priority:high
  color: b60205
  description: Do next
- name: priority:low
  color: c5def5
  description: Nice to have

# Process
- name: security
  color: ee0701
  description: Security fix or hardening
- name: dependencies
  color: 0366d6
  description: Dependency update
- name: needs-triage
  color: ededed
  description: New issue, not yet reviewed
- name: skip-changelog
  color: ffffff
  description: Leave out of release notes
- name: 'autorelease: pending'
  color: ededed
  description: release-please release PR not yet released
- name: 'autorelease: tagged'
  color: ededed
  description: release-please release PR tagged
