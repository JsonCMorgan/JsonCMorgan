name: NEONTRACE build

on:
  push:
    branches: [main]
    paths: ['neontrace/**', '.github/workflows/neontrace.yml']
    tags: ['neontrace-v*']
  pull_request:
    paths: ['neontrace/**', '.github/workflows/neontrace.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neontrace-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: neontrace

jobs:
  test:
    name: Tests + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neontrace/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neontrace-web
          path: neontrace/dist

  installers:
    name: Installer (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
          - name: linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neontrace/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: neontrace/src-tauri -> target

      - run: npm ci

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: neontrace
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/neontrace-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/neontrace-v') && 'NEONTRACE __VERSION__' || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: neontrace-${{ matrix.name }}
          if-no-files-found: error
          path: |
            neontrace/src-tauri/target/release/bundle/nsis/*.exe
            neontrace/src-tauri/target/release/bundle/msi/*.msi
            neontrace/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            neontrace/src-tauri/target/release/bundle/deb/*.deb
            neontrace/src-tauri/target/release/bundle/appimage/*.AppImage
