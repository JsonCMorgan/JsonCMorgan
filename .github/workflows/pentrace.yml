name: NEONTRACE installers

on:
  push:
    branches: [main]
    paths:
      - 'neontrace/**'
      - '.github/workflows/neontrace.yml'
  pull_request:
    paths:
      - 'neontrace/**'
      - '.github/workflows/neontrace.yml'
  workflow_dispatch:
  # Called by neontrace-release.yml to attach installers to a GitHub Release.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build
        type: string
        required: true
      release-id:
        description: GitHub Release id to upload installers to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release-id }}

jobs:
  installers:
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
          - name: linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: neontrace/.nvmrc
          cache: npm
          cache-dependency-path: neontrace/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: neontrace/src-tauri -> target

      - run: npm ci
        working-directory: neontrace

      - name: Build installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: neontrace
          args: ${{ matrix.args }}
          releaseId: ${{ inputs.release-id || '' }}
          retryAttempts: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neontrace-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            neontrace/src-tauri/target/release/bundle/nsis/*.exe
            neontrace/src-tauri/target/release/bundle/msi/*.msi
            neontrace/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            neontrace/src-tauri/target/release/bundle/deb/*.deb
            neontrace/src-tauri/target/release/bundle/appimage/*.AppImage
