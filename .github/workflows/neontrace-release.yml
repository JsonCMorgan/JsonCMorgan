name: NEONTRACE release

# Two ways to cut a release, both ending in a GitHub Release with Windows,
# macOS and Linux installers attached:
#   1. release-please (default): conventional commits on main keep a release PR
#      open; merging it bumps versions, updates neontrace/CHANGELOG.md and tags
#      neontrace-vX.Y.Z.
#   2. Manual: push a neontrace-v* tag; notes are generated by GitHub.
# Tags created by release-please use GITHUB_TOKEN and do not trigger new
# workflow runs, so installers are built in the same run below.

on:
  push:
    branches: [main]
    tags: ['neontrace-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing neontrace-v* tag to (re)build and attach installers for
        required: true

permissions:
  contents: read

concurrency:
  group: neontrace-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.rp.outputs['neontrace--release_created'] }}
      tag: ${{ steps.rp.outputs['neontrace--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # Optional PAT/App token so CI also runs on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  prepare:
    name: Prepare GitHub Release
    needs: release-please
    if: >-
      always() && !failure() && !cancelled() && (
        needs.release-please.outputs.created == 'true' ||
        startsWith(github.ref, 'refs/tags/neontrace-v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Ensure release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in neontrace-v*) ;; *) echo "::error::Unexpected tag '$TAG'"; exit 1 ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "NEONTRACE ${TAG#neontrace-v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  installers:
    name: Installers
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/neontrace.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      release-id: ${{ needs.prepare.outputs.release-id }}
